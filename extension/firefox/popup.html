<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Scribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & tokens ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0f14;
      --surface:    #151820;
      --surface2:   #1c2030;
      --border:     rgba(255,255,255,0.07);
      --text:       #e8eaf0;
      --muted:      #6b7280;
      --accent:     #4ade80;     /* green — recording active */
      --accent-dim: rgba(74,222,128,0.12);
      --warn:       #fb923c;
      --info:       #60a5fa;
      --danger:     #f87171;
      --mono:       'JetBrains Mono', monospace;
      --sans:       'DM Sans', sans-serif;
      --radius:     10px;
      --radius-sm:  6px;
    }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      overflow-x: hidden;
    }

    /* ── Header ──────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { width: 16px; height: 16px; }

    .header-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
    }
    .header-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    .header-gear {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      transition: color 0.15s, border-color 0.15s;
    }
    .header-gear:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ── Status bar ──────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .status-dot.stopped { background: var(--warn); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .status-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      flex: 1;
    }
    .status-label.active { color: var(--accent); }

    .timer {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      min-width: 50px;
      text-align: right;
    }

    /* ── Platform badge ──────────────────────────────────── */
    .platform-badge {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(96,165,250,0.08);
      border-bottom: 1px solid rgba(96,165,250,0.15);
      font-size: 11px;
      color: var(--info);
    }
    .platform-badge.visible { display: flex; }
    .platform-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--info); }

    /* ── Main control area ───────────────────────────────── */
    .main { padding: 16px; }

    .record-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      letter-spacing: -0.2px;
    }

    .record-btn.idle {
      background: var(--accent);
      color: #0a1a10;
    }
    .record-btn.idle:hover { background: #6ee79a; transform: translateY(-1px); }
    .record-btn.idle:active { transform: translateY(0); }

    .record-btn.recording {
      background: var(--danger);
      color: #fff;
      animation: btn-pulse 2s ease-in-out infinite;
    }
    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.4); }
      50%       { box-shadow: 0 0 0 6px rgba(248,113,113,0); }
    }
    .record-btn.recording:hover { background: #fca5a5; }
    .record-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* ── Stats row ───────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 10px 8px;
    }
    .stat-val {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Live transcript feed ────────────────────────────── */
    .transcript-section {
      margin-top: 12px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }
    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: var(--sans);
      transition: color 0.15s;
    }
    .clear-btn:hover { color: var(--danger); }

    .transcript-feed {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      height: 120px;
      overflow-y: auto;
      padding: 8px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    .transcript-feed::-webkit-scrollbar { width: 4px; }
    .transcript-feed::-webkit-scrollbar-track { background: transparent; }
    .transcript-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .segment-line { margin-bottom: 4px; }
    .seg-speaker {
      color: var(--info);
      font-weight: 600;
    }
    .seg-text { color: var(--text); }
    .seg-interim { color: var(--muted); font-style: italic; }
    .empty-feed { color: var(--muted); padding: 4px; }

    /* ── Action buttons ──────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .action-btn {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .action-btn:hover:not(:disabled) {
      background: var(--surface2);
      border-color: rgba(255,255,255,0.14);
    }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn.primary {
      border-color: rgba(96,165,250,0.4);
      color: var(--info);
    }
    .action-btn.primary:hover:not(:disabled) {
      background: rgba(96,165,250,0.08);
    }

    /* ── Settings panel ──────────────────────────────────── */
    .settings-panel {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .settings-panel.open { display: block; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 500;
    }
    .field input, .field select {
      width: 100%;
      height: 34px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 0 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: rgba(96,165,250,0.4);
    }
    .field select option { background: var(--bg); }

    .save-btn {
      width: 100%;
      height: 34px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .save-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 12px;
      opacity: 0;
      transition: all 0.25s;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { border-color: rgba(74,222,128,0.3); color: var(--accent); }
    .toast.error   { border-color: rgba(248,113,113,0.3); color: var(--danger); }
    .toast.info    { border-color: rgba(96,165,250,0.3); color: var(--info); }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="5" r="3" fill="#0a1a10"/>
      <path d="M2 11c0-2.5 2.7-4 6-4s6 1.5 6 4" stroke="#0a1a10" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="13" cy="9" r="2.5" fill="#0a1a10"/>
      <path d="M13 7.5v1M12 9h2" stroke="#0a1a10" stroke-width="1" stroke-linecap="round"/>
    </svg>
  </div>
  <div>
    <div class="header-title">Meeting Scribe</div>
    <div class="header-sub">Live transcript capture</div>
  </div>
  <button class="header-gear" id="gearBtn" title="Settings">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-label" id="statusLabel">Ready to capture</span>
  <span class="timer" id="timer">00:00</span>
</div>

<!-- Platform badge -->
<div class="platform-badge" id="platformBadge">
  <div class="platform-dot"></div>
  <span id="platformName">Detected: Google Meet</span>
</div>

<!-- Main content -->
<div class="main">

  <!-- Record button -->
  <button class="record-btn idle" id="recordBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="recordIcon">
      <circle cx="12" cy="12" r="8"/>
    </svg>
    <span id="recordLabel">Start Recording</span>
  </button>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="statSegments">0</div>
      <div class="stat-label">Segments</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statWords">0</div>
      <div class="stat-label">Words</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statSpeakers">—</div>
      <div class="stat-label">Speakers</div>
    </div>
  </div>

  <!-- Live transcript feed -->
  <div class="transcript-section">
    <div class="section-header">
      <span class="section-title">Live Transcript</span>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
    <div class="transcript-feed" id="transcriptFeed">
      <span class="empty-feed">Transcript will appear here once recording starts…</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn" id="downloadVttBtn" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download .vtt
    </button>
    <button class="action-btn" id="downloadTxtBtn" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download .txt
    </button>
    <button class="action-btn primary" id="uploadBtn" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      Send to Hub
    </button>
    <button class="action-btn" id="copyBtn" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy Text
    </button>
  </div>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="field">
    <label>Backend URL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:8000" />
  </div>
  <div class="field">
    <label>Language</label>
    <select id="language">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="en-IN">English (India)</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="pt-BR">Portuguese (Brazil)</option>
      <option value="ja-JP">Japanese</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="hi-IN">Hindi</option>
      <option value="ar-SA">Arabic</option>
    </select>
  </div>
  <div class="field">
    <label>Export Format</label>
    <select id="exportFormat">
      <option value="vtt">WebVTT (.vtt) — recommended</option>
      <option value="txt">Plain text (.txt)</option>
    </select>
  </div>
  <div class="field">
    <label>Your Name (for speaker attribution)</label>
    <input type="text" id="speakerName" placeholder="e.g. Alice" />
  </div>
  <button class="save-btn" id="saveSettingsBtn">Save Settings</button>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="popup_compat.js"></script>
<script src="popup.js"></script>
</body>
</html>
